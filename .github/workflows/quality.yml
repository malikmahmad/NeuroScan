name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-lint:
    name: Python lint (black, flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: pip install black==26.5.1 flake8==7.3.0

      - name: black --check
        run: black --check --line-length 110 backend/app/ backend/tests/

      - name: flake8
        run: flake8 backend/app/ backend/tests/ --max-line-length=110 --extend-ignore=E203

  python-types:
    name: Python types (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install mypy \
            fastapi==0.138.1 \
            "uvicorn[standard]==0.49.0" \
            Pillow==12.2.0 \
            numpy==2.4.6 \
            python-multipart==0.0.32 \
            matplotlib==3.11.0
          pip install torch==2.12.1+cpu torchvision==0.27.1+cpu \
            --index-url https://download.pytorch.org/whl/cpu

      - name: mypy
        run: mypy backend/app/ --ignore-missing-imports


