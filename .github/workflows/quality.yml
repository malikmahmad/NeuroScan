name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-lint:
    name: Python lint (flake8, black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: pip install flake8 black

      - name: black --format and commit
        run: |
          black --line-length 110 backend/app/ backend/tests/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || git commit -am "style: auto-format with black (line-length 110)"
          git push || true

      - name: flake8
        run: flake8 backend/app/ backend/tests/ --max-line-length=110 --extend-ignore=E203

  python-types:
    name: Python types (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install mypy
          pip install fastapi uvicorn Pillow numpy python-multipart matplotlib
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: mypy
        continue-on-error: true
        run: mypy backend/app/ --ignore-missing-imports
