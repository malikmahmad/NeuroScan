name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install \
            fastapi==0.138.1 \
            "uvicorn[standard]==0.49.0" \
            Pillow==12.2.0 \
            numpy==2.4.6 \
            python-multipart==0.0.32 \
            matplotlib==3.11.0 \
            timm==1.0.9 \
            pytest pytest-cov
          pip install torch==2.12.1+cpu torchvision==0.27.1+cpu \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Run tests
        run: |
          set +e
          pytest backend/ --tb=short --cov=backend/app --cov-report=term-missing
          code=$?
          if [ $code -eq 5 ]; then
            echo "No tests collected — exit 0."
            exit 0
          fi
          exit $code
        env:
          NEUROSCAN_CI: "1"
