version: "3.9"
# NeuroScan — FastAPI inference backend
# Runs the FastAPI inference server with all 8 model endpoints.
# Frontend: see frontend/ directory (npm run dev).

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/models:/app/models
    environment:
      - PYTHONUNBUFFERED=1
