version: "3.9"

# NeuroScan Research Backend
# Runs the FastAPI inference server with all four model endpoints.
#
# Frontend web application is maintained separately:
# https://github.com/malikmahmad/NeuroScan-Frontend

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/models:/app/models
    environment:
      - PYTHONUNBUFFERED=1
