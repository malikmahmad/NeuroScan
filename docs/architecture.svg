<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5d6e7d" />
    </marker>
  </defs>

  <rect width="1000" height="560" fill="#0a0e13" />

  <!-- Title -->
  <text x="500" y="36" text-anchor="middle" fill="#e7edf3" font-size="20" font-weight="700">NeuroScan — System Architecture</text>

  <!-- Frontend box -->
  <rect x="40" y="80" width="220" height="140" rx="10" fill="#11161d" stroke="#344150" stroke-width="1.5"/>
  <text x="150" y="108" text-anchor="middle" fill="#3ddc97" font-size="14" font-weight="700">React + TypeScript</text>
  <text x="150" y="130" text-anchor="middle" fill="#8fa0af" font-size="12">Upload Zone</text>
  <text x="150" y="150" text-anchor="middle" fill="#8fa0af" font-size="12">Results / Comparison Panels</text>
  <text x="150" y="170" text-anchor="middle" fill="#8fa0af" font-size="12">Model Status Bar</text>
  <text x="150" y="200" text-anchor="middle" fill="#5d6e7d" font-size="11">localhost:5173</text>

  <!-- Arrow frontend -> backend -->
  <line x1="260" y1="150" x2="360" y2="150" stroke="#5d6e7d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="310" y="138" text-anchor="middle" fill="#5d6e7d" font-size="10">HTTP / multipart</text>

  <!-- Backend box -->
  <rect x="360" y="60" width="280" height="220" rx="10" fill="#11161d" stroke="#344150" stroke-width="1.5"/>
  <text x="500" y="88" text-anchor="middle" fill="#3ddc97" font-size="14" font-weight="700">FastAPI Backend</text>
  <text x="500" y="112" text-anchor="middle" fill="#8fa0af" font-size="12">/api/classify</text>
  <text x="500" y="132" text-anchor="middle" fill="#8fa0af" font-size="12">/api/classify/compare</text>
  <text x="500" y="152" text-anchor="middle" fill="#8fa0af" font-size="12">/api/segment</text>
  <text x="500" y="172" text-anchor="middle" fill="#8fa0af" font-size="12">/api/analyze</text>
  <rect x="380" y="190" width="240" height="70" rx="6" fill="#161d26" stroke="#232c36"/>
  <text x="500" y="208" text-anchor="middle" fill="#5b9fe3" font-size="11" font-weight="600">ModelRegistry</text>
  <text x="500" y="226" text-anchor="middle" fill="#5d6e7d" font-size="10">lazy-loads .pth checkpoints</text>
  <text x="500" y="242" text-anchor="middle" fill="#5d6e7d" font-size="10">fails loudly if missing — no fake output</text>

  <!-- Arrow backend -> models -->
  <line x1="500" y1="280" x2="500" y2="330" stroke="#5d6e7d" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Model boxes row -->
  <g>
    <rect x="360" y="340" width="125" height="70" rx="8" fill="#161d26" stroke="#344150"/>
    <text x="422" y="365" text-anchor="middle" fill="#e7edf3" font-size="12" font-weight="600">CNN</text>
    <text x="422" y="382" text-anchor="middle" fill="#5d6e7d" font-size="10">Grad-CAM</text>

    <rect x="500" y="340" width="135" height="70" rx="8" fill="#161d26" stroke="#344150"/>
    <text x="567" y="365" text-anchor="middle" fill="#e7edf3" font-size="12" font-weight="600">EfficientNet-B0</text>
    <text x="567" y="382" text-anchor="middle" fill="#5d6e7d" font-size="10">Grad-CAM</text>
  </g>

  <rect x="650" y="340" width="125" height="70" rx="8" fill="#161d26" stroke="#344150"/>
  <text x="712" y="365" text-anchor="middle" fill="#e7edf3" font-size="12" font-weight="600">ViT-B/16</text>
  <text x="712" y="382" text-anchor="middle" fill="#5d6e7d" font-size="10">Attention Rollout</text>

  <rect x="360" y="430" width="415" height="60" rx="8" fill="#161d26" stroke="#f0a857" stroke-opacity="0.5"/>
  <text x="567" y="455" text-anchor="middle" fill="#f0a857" font-size="12" font-weight="600">U-Net (Segmentation)</text>
  <text x="567" y="472" text-anchor="middle" fill="#5d6e7d" font-size="10">runs only when a tumor class is predicted</text>

  <!-- connecting lines from backend model registry down to each -->
  <line x1="422" y1="330" x2="422" y2="340" stroke="#344150" stroke-width="1.2"/>
  <line x1="567" y1="330" x2="567" y2="340" stroke="#344150" stroke-width="1.2"/>
  <line x1="712" y1="330" x2="712" y2="340" stroke="#344150" stroke-width="1.2"/>
  <line x1="500" y1="410" x2="500" y2="430" stroke="#344150" stroke-width="1.2"/>

  <!-- Training pipeline box (offline, separate from serving path) -->
  <rect x="700" y="60" width="260" height="220" rx="10" fill="#11161d" stroke="#344150" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="830" y="88" text-anchor="middle" fill="#5b9fe3" font-size="13" font-weight="700">Offline Training (Kaggle GPU)</text>
  <text x="830" y="114" text-anchor="middle" fill="#8fa0af" font-size="11">train_classification.py</text>
  <text x="830" y="134" text-anchor="middle" fill="#5d6e7d" font-size="10">Kaggle "Brain Tumor MRI Dataset"</text>
  <text x="830" y="160" text-anchor="middle" fill="#8fa0af" font-size="11">train_segmentation.py</text>
  <text x="830" y="180" text-anchor="middle" fill="#5d6e7d" font-size="10">Kaggle "LGG MRI Segmentation"</text>
  <text x="830" y="206" text-anchor="middle" fill="#8fa0af" font-size="11">explainability.py</text>
  <text x="830" y="226" text-anchor="middle" fill="#5d6e7d" font-size="10">Grad-CAM + Attention Rollout figures</text>
  <line x1="830" y1="240" x2="830" y2="260" stroke="#5d6e7d" stroke-width="1.2" marker-end="url(#arrow)" stroke-dasharray="3,3"/>
  <text x="830" y="258" text-anchor="middle" fill="#5d6e7d" font-size="9">*.pth -&gt; backend/models/</text>

  <!-- Legend -->
  <text x="40" y="530" fill="#5d6e7d" font-size="11">Solid border = always-on serving path.  Dashed border = run once, offline, to produce checkpoints.</text>
</svg>
