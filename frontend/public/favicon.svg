<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d1f2d"/>
      <stop offset="100%" stop-color="#070b0f"/>
    </radialGradient>
    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4d6d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff4d6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>

  <!-- Outer hexagon frame -->
  <polygon
    points="32,4 56,18 56,46 32,60 8,46 8,18"
    fill="none"
    stroke="#00d4ff"
    stroke-width="1.2"
    opacity="0.25"
  />

  <!-- Inner hexagon -->
  <polygon
    points="32,12 50,22 50,42 32,52 14,42 14,22"
    fill="none"
    stroke="#00d4ff"
    stroke-width="0.8"
    opacity="0.15"
  />

  <!-- Neural connection lines -->
  <line x1="32" y1="14" x2="18" y2="28" stroke="#00d4ff" stroke-width="0.9" opacity="0.5"/>
  <line x1="32" y1="14" x2="46" y2="28" stroke="#00d4ff" stroke-width="0.9" opacity="0.5"/>
  <line x1="18" y1="28" x2="14" y2="42" stroke="#00d4ff" stroke-width="0.9" opacity="0.4"/>
  <line x1="46" y1="28" x2="50" y2="42" stroke="#00d4ff" stroke-width="0.9" opacity="0.4"/>
  <line x1="14" y1="42" x2="32" y2="50" stroke="#00d4ff" stroke-width="0.9" opacity="0.4"/>
  <line x1="50" y1="42" x2="32" y2="50" stroke="#00d4ff" stroke-width="0.9" opacity="0.4"/>
  <line x1="18" y1="28" x2="32" y2="32" stroke="#4facfe" stroke-width="0.8" opacity="0.45"/>
  <line x1="46" y1="28" x2="32" y2="32" stroke="#4facfe" stroke-width="0.8" opacity="0.45"/>
  <line x1="14" y1="42" x2="32" y2="32" stroke="#4facfe" stroke-width="0.8" opacity="0.35"/>
  <line x1="50" y1="42" x2="32" y2="32" stroke="#4facfe" stroke-width="0.8" opacity="0.35"/>

  <!-- Horizontal scan beam -->
  <line x1="10" y1="32" x2="54" y2="32" stroke="#00d4ff" stroke-width="1.0" opacity="0.6"/>
  <!-- Scan beam glow -->
  <line x1="10" y1="32" x2="54" y2="32" stroke="#00d4ff" stroke-width="3" opacity="0.08"/>

  <!-- Neural nodes (outer) -->
  <circle cx="32" cy="14" r="2.2" fill="#00d4ff" opacity="0.9"/>
  <circle cx="18" cy="28" r="1.8" fill="#4facfe" opacity="0.85"/>
  <circle cx="46" cy="28" r="1.8" fill="#4facfe" opacity="0.85"/>
  <circle cx="14" cy="42" r="1.8" fill="#4facfe" opacity="0.75"/>
  <circle cx="50" cy="42" r="1.8" fill="#4facfe" opacity="0.75"/>
  <circle cx="32" cy="50" r="2.2" fill="#00d4ff" opacity="0.9"/>

  <!-- Scan intersection dots on beam -->
  <circle cx="18" cy="32" r="1.2" fill="#00d4ff" opacity="0.7"/>
  <circle cx="46" cy="32" r="1.2" fill="#00d4ff" opacity="0.7"/>

  <!-- Center tumor node — glowing red -->
  <circle cx="32" cy="32" r="10" fill="url(#glowRed)" opacity="0.18"/>
  <circle cx="32" cy="32" r="5"  fill="none" stroke="#ff4d6d" stroke-width="0.8" opacity="0.4"/>
  <circle cx="32" cy="32" r="3"  fill="#ff4d6d" opacity="0.95"/>
  <!-- Center highlight -->
  <circle cx="31" cy="31" r="1"  fill="#ffffff" opacity="0.35"/>

  <!-- Corner tick marks (MRI frame aesthetic) -->
  <path d="M4 14 L4 8 L10 8"  stroke="#00d4ff" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <path d="M60 14 L60 8 L54 8" stroke="#00d4ff" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <path d="M4 50 L4 56 L10 56" stroke="#00d4ff" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <path d="M60 50 L60 56 L54 56" stroke="#00d4ff" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
</svg>
